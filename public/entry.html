<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collation Ledger — Entry</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="ledger">
  <div class="masthead">
    <div class="eyebrow">Data Collation &amp; Reporting</div>
    <h1 id="catTitle">Loading…</h1>
    <p class="muted" id="catSub"></p>
  </div>

  <div id="alerts"></div>

  <div class="panel" id="formPanel" style="display:none;">
    <h2>Add an entry</h2>
    <label for="poc">Point of contact (your name) <span style="color:#7a2e2e">*</span></label>
    <input type="text" id="poc" placeholder="Who is submitting this entry?" autocomplete="off" />
    <p class="muted">This is required before any entry can be recorded, so it's always clear who added what.</p>

    <div id="fieldsWrap" style="opacity:0.4; pointer-events:none;"></div>

    <div style="margin-top:18px;">
      <button id="submitBtn">Add entry</button>
    </div>
  </div>

  <div class="panel" id="listPanel" style="display:none;">
    <h2>Entries so far</h2>
    <table id="entriesTable">
      <thead><tr id="entriesHead"></tr></thead>
      <tbody id="entriesBody"></tbody>
    </table>
    <p class="muted" id="emptyMsg" style="display:none;">No entries yet — be the first to add one.</p>
  </div>

  <footer class="sig">you may add and remove your own entries; others' entries are visible but not yours to change</footer>
</div>

<script>
const params = new URLSearchParams(location.search);
const catId = params.get('cat');
const token = params.get('t');

function ownerToken() {
  let t = localStorage.getItem('collation_owner_token');
  if (!t) {
    t = 'own_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    localStorage.setItem('collation_owner_token', t);
  }
  return t;
}

function showAlert(msg, type) {
  const el = document.getElementById('alerts');
  el.innerHTML = `<div class="${type}">${msg}</div>`;
}

let category = null;

async function loadCategory() {
  if (!catId || !token) {
    document.getElementById('catTitle').textContent = 'No link provided';
    showAlert('This page needs a category link. Please use the link that was shared with you.', 'error');
    return;
  }
  try {
    const res = await fetch(`/api/categories?id=${encodeURIComponent(catId)}&token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('catTitle').textContent = 'Link not valid';
      showAlert(data.error || 'This link could not be used.', 'error');
      return;
    }
    category = data.category;
    document.getElementById('catTitle').textContent = category.name;
    document.getElementById('catSub').textContent = `${category.fields.length} field(s) collected for this category`;
    renderFields();
    document.getElementById('formPanel').style.display = 'block';
    document.getElementById('listPanel').style.display = 'block';
    await loadEntries();
  } catch (e) {
    showAlert('Could not reach the ledger. Please try again.', 'error');
  }
}

function renderFields() {
  const wrap = document.getElementById('fieldsWrap');
  wrap.innerHTML = category.fields.map(f => `
    <label for="f_${f.key}">${f.label}</label>
    <input type="text" id="f_${f.key}" data-key="${f.key}" />
  `).join('');

  const head = document.getElementById('entriesHead');
  head.innerHTML = '<th>Point of Contact</th>' + category.fields.map(f => `<th>${f.label}</th>`).join('') + '<th>Status</th><th></th>';
}

document.getElementById('poc').addEventListener('input', (e) => {
  const wrap = document.getElementById('fieldsWrap');
  const has = e.target.value.trim().length > 0;
  wrap.style.opacity = has ? '1' : '0.4';
  wrap.style.pointerEvents = has ? 'auto' : 'none';
});

async function loadEntries() {
  const res = await fetch(`/api/entries?category=${encodeURIComponent(catId)}&token=${encodeURIComponent(token)}`);
  const data = await res.json();
  if (!res.ok) return;
  const body = document.getElementById('entriesBody');
  const mine = ownerToken();
  if (data.entries.length === 0) {
    document.getElementById('emptyMsg').style.display = 'block';
    body.innerHTML = '';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';
  body.innerHTML = data.entries.map(e => {
    const cells = category.fields.map(f => `<td>${(e.values[f.key] || '').toString()}</td>`).join('');
    const canDelete = !e.viewed && e.ownerToken === mine;
    const status = e.viewed
      ? '<span class="badge viewed">Reviewed</span>'
      : '<span class="badge new">Open</span>';
    const action = canDelete
      ? `<button class="danger" onclick="deleteEntry('${e.id}')">Remove</button>`
      : '';
    return `<tr class="${e.viewed ? 'viewed' : ''}"><td>${e.pointOfContact}</td>${cells}<td>${status}</td><td class="row-actions">${action}</td></tr>`;
  }).join('');
}

async function deleteEntry(id) {
  if (!confirm('Remove this entry?')) return;
  const res = await fetch(`/api/entries?id=${encodeURIComponent(id)}&ownerToken=${encodeURIComponent(ownerToken())}`, { method: 'DELETE' });
  const data = await res.json();
  if (!res.ok) { showAlert(data.error, 'error'); return; }
  loadEntries();
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const poc = document.getElementById('poc').value.trim();
  if (!poc) { showAlert('Please enter the point of contact name first.', 'error'); return; }
  const values = {};
  category.fields.forEach(f => {
    values[f.key] = document.getElementById(`f_${f.key}`).value.trim();
  });
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/entries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ categoryId: catId, token, pointOfContact: poc, values, ownerToken: ownerToken() })
    });
    const data = await res.json();
    if (!res.ok) { showAlert(data.error, 'error'); return; }
    showAlert('Entry added.', 'notice');
    category.fields.forEach(f => { document.getElementById(`f_${f.key}`).value = ''; });
    loadEntries();
  } finally {
    btn.disabled = false;
  }
});

loadCategory();
</script>
</body>
</html>
