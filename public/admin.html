<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collation Ledger — Admin Desk</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="ledger">
  <div class="masthead">
    <div class="eyebrow">Data Collation &amp; Reporting</div>
    <h1>The Admin Desk</h1>
    <p class="muted">Manage categories, review entries, and export reports.</p>
  </div>

  <div id="alerts"></div>

  <div class="panel" id="loginPanel">
    <h2>Sign in</h2>
    <label for="pw">Admin password</label>
    <input type="password" id="pw" />
    <div style="margin-top:14px;"><button id="loginBtn">Sign in</button></div>
  </div>

  <div id="adminArea" style="display:none;">

    <div class="panel">
      <h2>Categories</h2>
      <table>
        <thead><tr><th>Name</th><th>Fields</th><th>Share link (send this to contributors)</th><th></th></tr></thead>
        <tbody id="catBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Add a category</h2>
      <label for="newCatName">Category name</label>
      <input type="text" id="newCatName" placeholder="e.g. Christmas Outreach" />
      <label>Fields to collect</label>
      <div id="fieldRows"></div>
      <button class="ghost" id="addFieldRow" style="margin-top:8px;">+ Add field</button>
      <div style="margin-top:16px;"><button id="createCatBtn">Create category</button></div>
    </div>

    <div class="panel">
      <h2>Review entries</h2>
      <label for="catSelect">Category</label>
      <select id="catSelect"></select>
      <div style="margin-top:14px;">
        <table>
          <thead><tr id="entHead"></tr></thead>
          <tbody id="entBody"></tbody>
        </table>
        <p class="muted" id="entEmpty" style="display:none;">No entries in this category yet.</p>
      </div>
      <div style="margin-top:14px;">
        <button class="ghost" id="exportBtn">Export report (CSV)</button>
      </div>
    </div>
  </div>

  <footer class="sig">the admin's word is final</footer>
</div>

<script>
let categories = [];
let currentCat = null;
let currentEntries = [];

function pw() { return sessionStorage.getItem('admin_password') || ''; }
function authHeaders() { return { 'x-admin-password': pw(), 'Content-Type': 'application/json' }; }

function showAlert(msg, type) {
  document.getElementById('alerts').innerHTML = `<div class="${type}">${msg}</div>`;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  sessionStorage.setItem('admin_password', document.getElementById('pw').value);
  await tryLoad();
});

async function tryLoad() {
  let res, data;
  try {
    res = await fetch('/api/categories', { headers: authHeaders() });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    showAlert('Could not reach the server at all (network/DNS error). Check that the site deployed correctly.', 'error');
    return;
  }
  if (!res.ok) {
    sessionStorage.removeItem('admin_password');
    if (res.status === 401) {
      showAlert('Incorrect password.', 'error');
    } else if (res.status === 404) {
      showAlert('The /api/categories function was not found (404). The Netlify Functions likely did not deploy — check the Functions tab on Netlify.', 'error');
    } else {
      showAlert(`Server error (status ${res.status}): ${data.error || 'no further detail returned.'}`, 'error');
    }
    return;
  }
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('adminArea').style.display = 'block';
  const data = await res.json();
  categories = data.categories;
  renderCategories();
  renderCatSelect();
  if (categories[0]) {
    document.getElementById('catSelect').value = categories[0].id;
    loadEntriesFor(categories[0].id);
  }
}

function renderCategories() {
  const body = document.getElementById('catBody');
  body.innerHTML = categories.map(c => {
    const link = `${location.origin}/entry.html?cat=${c.id}&t=${c.shareToken}`;
    return `<tr>
      <td>${c.name}</td>
      <td>${c.fields.map(f => f.label).join(', ')}</td>
      <td><span class="share-link">${link}</span>
          <button class="ghost" style="margin-top:6px;padding:3px 8px;font-size:11px;" onclick="copyLink('${link}')">Copy link</button></td>
      <td><button class="danger" onclick="deleteCat('${c.id}')">Delete</button></td>
    </tr>`;
  }).join('');
}

function copyLink(link) {
  navigator.clipboard.writeText(link);
  showAlert('Link copied.', 'notice');
}

async function deleteCat(id) {
  if (!confirm('Delete this category and lose its share link? Existing entries will remain but become inaccessible.')) return;
  const res = await fetch(`/api/categories?id=${id}`, { method: 'DELETE', headers: authHeaders() });
  if (res.ok) { await tryLoad(); }
}

function renderCatSelect() {
  const sel = document.getElementById('catSelect');
  sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  sel.onchange = () => loadEntriesFor(sel.value);
}

// ---- field row builder for new category form ----
function addFieldRow(key = '', label = '') {
  const wrap = document.getElementById('fieldRows');
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '8px';
  row.style.marginTop = '8px';
  row.innerHTML = `
    <input type="text" placeholder="field key e.g. phone" class="fkey" value="${key}" style="flex:1;">
    <input type="text" placeholder="Label shown on form e.g. Phone Number" class="flabel" value="${label}" style="flex:2;">
    <button class="danger" type="button" onclick="this.parentElement.remove()">✕</button>
  `;
  wrap.appendChild(row);
}
document.getElementById('addFieldRow').addEventListener('click', () => addFieldRow());
addFieldRow('name', 'Name');
addFieldRow('phone', 'Phone Number');
addFieldRow('email', 'Email');

document.getElementById('createCatBtn').addEventListener('click', async () => {
  const name = document.getElementById('newCatName').value.trim();
  const rows = [...document.querySelectorAll('#fieldRows > div')];
  const fields = rows.map(r => ({
    key: r.querySelector('.fkey').value.trim(),
    label: r.querySelector('.flabel').value.trim()
  })).filter(f => f.key && f.label);
  if (!name || fields.length === 0) { showAlert('Give the category a name and at least one field.', 'error'); return; }
  const res = await fetch('/api/categories', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ name, fields }) });
  const data = await res.json();
  if (!res.ok) { showAlert(data.error, 'error'); return; }
  showAlert('Category created.', 'notice');
  document.getElementById('newCatName').value = '';
  await tryLoad();
});

// ---- entries review ----
async function loadEntriesFor(catId) {
  currentCat = categories.find(c => c.id === catId);
  if (!currentCat) return;
  const head = document.getElementById('entHead');
  head.innerHTML = '<th>Point of Contact</th>' + currentCat.fields.map(f => `<th>${f.label}</th>`).join('') + '<th>Added</th><th>Status</th><th></th>';

  const res = await fetch(`/api/entries?category=${catId}`, { headers: authHeaders() });
  const data = await res.json();
  currentEntries = data.entries || [];
  const body = document.getElementById('entBody');
  document.getElementById('entEmpty').style.display = currentEntries.length ? 'none' : 'block';
  body.innerHTML = currentEntries.map(e => {
    const cells = currentCat.fields.map(f => `<td>${(e.values[f.key] || '')}</td>`).join('');
    const status = e.viewed ? '<span class="badge viewed">Reviewed</span>' : '<span class="badge new">Open</span>';
    const toggleLabel = e.viewed ? 'Mark unreviewed' : 'Mark reviewed';
    return `<tr class="${e.viewed ? 'viewed' : ''}">
      <td>${e.pointOfContact}</td>${cells}
      <td class="muted">${new Date(e.createdAt).toLocaleDateString()}</td>
      <td>${status}</td>
      <td class="row-actions">
        <button class="ghost" onclick="toggleViewed('${e.id}', ${!e.viewed})">${toggleLabel}</button>
        <button class="danger" onclick="adminDelete('${e.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

async function toggleViewed(id, viewed) {
  await fetch(`/api/entries?id=${id}`, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ viewed }) });
  loadEntriesFor(currentCat.id);
}

async function adminDelete(id) {
  if (!confirm('Delete this entry permanently?')) return;
  await fetch(`/api/entries?id=${id}`, { method: 'DELETE', headers: authHeaders() });
  loadEntriesFor(currentCat.id);
}

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!currentCat) return;
  const headers = ['Point of Contact', ...currentCat.fields.map(f => f.label), 'Added', 'Reviewed'];
  const rows = currentEntries.map(e => [
    e.pointOfContact,
    ...currentCat.fields.map(f => e.values[f.key] || ''),
    new Date(e.createdAt).toLocaleString(),
    e.viewed ? 'Yes' : 'No'
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentCat.name.replace(/\s+/g, '_')}_report.csv`;
  a.click();
});

// auto sign-in if password already in session
if (pw()) { tryLoad(); }
</script>
</body>
</html>
